[package]
name = "ainigma"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ainigma"
path = "src/bin/cli.rs"

[dependencies]
# Our async runtime
tokio = { version = "1.53", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "process",
] }

# Crypto
sha3 = "0.12"
hmac = "0.13"
rand = "0.10"
base16ct = { version = "1", features = ["alloc"] }

serde = { version = "1.0", default-features = false, features = ["derive"] }
toml = "1.1"

# Cli
itertools = "0.15.0"
clap = { version = "4.6", features = ["derive", "cargo"] }
thiserror = "2"
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = [] }
aws-sdk-s3 = { version = "1.144.0", default-features = false, features = ["rt-tokio"] }
aws-config = { version = "1.11.0", default-features = false, features = [
  "client-hyper",
  "rt-tokio",
  "rustls",
] }
futures = "0.3.34"
moodle-xml = "0.2.0"
serde_json = "1"
once_cell = { version = "1", default-features = false }
tempfile = { version = "3", default-features = false }
[dependencies.uuid]
version = "1"
features = [
  "v7", # Lets you generate random UUIDs
  "fast-rng", # Use a faster (but still sufficiently random) RNG
  "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
  "serde",
]

[dev-dependencies]
insta = { version = "1" }
assert_cmd = "2"
predicates = "3"
